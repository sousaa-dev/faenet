version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: faenet
      POSTGRES_USER: faenet
      POSTGRES_PASSWORD: faenet123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faenet"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://faenet:faenet123@db:5432/faenet
      SECRET_KEY: dev_secret_key_troque_em_producao
      FLASK_DEBUG: "1"
      PORT: "5000"
    volumes:
      # Monta uploads fora do container para persistência
      - ./static/uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
