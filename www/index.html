<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>FaeNet</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080e1d;font-family:'DM Sans',sans-serif;padding-top:env(safe-area-inset-top)}
    #app-loading{position:fixed;inset:0;background:#080e1d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
    .load-gem{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;font-family:'Syne',sans-serif;box-shadow:0 8px 32px rgba(14,165,233,.4);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .load-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:#f1f5f9}
    .load-sub{font-size:13px;color:#64748b}
    .load-error{color:#f87171}
    iframe{width:100%;height:100vh;border:none;background:#080e1d;display:block}
    @media(max-width:720px){iframe{height:calc(100vh - env(safe-area-inset-top))}}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="app-loading">
  <div class="load-gem">F</div>
  <div class="load-title">FaeNet</div>
  <div class="load-sub" id="load-sub">Conectando ao servidor...</div>
</div>
<div id="app-frame" style="display:none"></div>

<script>
// ══════════════════════════════════════════════════════
//  TROQUE PELA URL DO SEU SERVIDOR RAILWAY/RENDER
// ══════════════════════════════════════════════════════
const API_BASE = 'https://SEU-SITE.railway.app';

const sub = document.getElementById('load-sub');
let retries = 0;

async function checkAuth() {
  try {
    sub.textContent = 'Verificando login...';
    sub.className = 'load-sub';
    const r = await fetch(API_BASE + '/api/me', { credentials: 'include' });
    if (r.ok) {
      loadPage('/feed');
    } else {
      loadPage('/');
    }
  } catch(e) {
    retries++;
    if (retries <= 3) {
      sub.textContent = `Sem conexão. Tentando novamente... (${retries}/3)`;
      sub.className = 'load-sub load-error';
      setTimeout(checkAuth, 2000);
    } else {
      sub.textContent = 'Não foi possível conectar. Verifique sua internet.';
      sub.className = 'load-sub load-error';
      // botão retry
      const btn = document.createElement('button');
      btn.textContent = 'Tentar novamente';
      btn.style.cssText = 'margin-top:16px;padding:10px 24px;background:#0ea5e9;color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer';
      btn.onclick = () => { retries = 0; btn.remove(); checkAuth(); };
      document.getElementById('app-loading').appendChild(btn);
    }
  }
}

function loadPage(path) {
  const frame = document.getElementById('app-frame');
  frame.innerHTML = `<iframe src="${API_BASE}${path}" id="main-iframe" allowfullscreen></iframe>`;
  
  const iframe = document.getElementById('main-iframe');
  iframe.onload = () => {
    document.getElementById('app-loading').style.display = 'none';
    frame.style.display = '';
  };
  
  // Fallback timeout
  setTimeout(() => {
    document.getElementById('app-loading').style.display = 'none';
    frame.style.display = '';
  }, 5000);
}

// Inicia após um pequeno delay para mostrar a splash
setTimeout(checkAuth, 1200);
</script>
</body>
</html>
